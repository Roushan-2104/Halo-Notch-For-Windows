<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Shammy Island Canon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--island:#000;--card:#1C1C1E;--fill:#2C2C2E;--fill2:#3A3A3C;--label:#F5F5F7;--sec:#98989D;
  --blue:#0A84FF;--blueBtn:#0071E3;--green:#30D158;--orange:#FF9F0A;--font:'Inter Tight',-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;font:13px/1.3 var(--font);color:var(--label);-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#DCE0E7 0%,#C3CAD6 55%,#AEB7C6 100%)}
.tn{font-variant-numeric:tabular-nums}
svg{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* desktop stand-in */
.desk{position:absolute;inset:0;filter:blur(2px)}
.win{position:absolute;top:64px;bottom:44px;border-radius:12px;background:rgba(248,249,251,.62);border:1px solid rgba(255,255,255,.5);overflow:hidden}
.win.ed{left:44px;width:684px}.win.br{left:756px;width:640px}
.bar{height:34px;background:rgba(236,238,242,.7)}
.ln{height:7px;border-radius:4px;background:rgba(150,158,172,.28);margin:14px 0 0 var(--x,32px);width:var(--w)}
.blk{border-radius:8px;background:rgba(150,158,172,.2);margin:18px 28px 0;height:var(--h)}
/* the island */
.island{position:absolute;top:0;left:220px;width:1000px;height:260px;background:var(--island);border-radius:0 0 42px 42px;padding:14px 16px 16px;
  display:flex;flex-direction:column;gap:12px}
.island::before,.island::after{content:"";position:absolute;top:0;width:16px;height:16px}
.island::before{left:-16px;background:radial-gradient(circle at 0 100%,transparent 15.5px,#000 16px)}
.island::after{right:-16px;background:radial-gradient(circle at 100% 100%,transparent 15.5px,#000 16px)}
.top{display:flex;align-items:center;gap:6px;height:32px}
.eyes{width:46px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:7px;margin-right:4px}
.eyes i{width:9px;height:17px;border-radius:5px;background:#fff}
.chip{height:30px;padding:0 12px;border-radius:15px;background:var(--card);font-weight:500;font-size:12.5px;letter-spacing:-.005em}
.search{flex:1;height:30px;border-radius:15px;background:var(--card);display:flex;align-items:center;gap:7px;padding:0 12px;margin-left:6px;color:var(--sec)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--label);font:13px var(--font)}
.search input::placeholder{color:var(--sec)}
.cards{flex:1;display:grid;grid-template-columns:232px 180px 170px 196px 1fr;gap:10px;min-height:0}
.card{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;min-width:0}
.kick{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--sec)}
.title{font-size:15px;font-weight:600;letter-spacing:-.01em}.sub{color:var(--sec);font-size:13px}
/* music */
.art{width:46px;height:46px;border-radius:11px;background:linear-gradient(140deg,#F2A65A 0%,#D9573B 55%,#8E2C48 100%);flex:none}
.wave{display:flex;gap:2px;align-items:center;height:18px;margin-left:auto}.wave i{width:3px;border-radius:2px;background:#F2A65A}
.scrub{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--sec)}
.track{flex:1;height:5px;border-radius:3px;background:var(--fill2);overflow:hidden}.track b{display:block;height:100%;background:var(--label);border-radius:3px}
.trans{display:flex;justify-content:center;gap:26px;margin-top:auto;align-items:center}
.trans button{width:32px;height:32px;display:grid;place-items:center;border-radius:16px}
/* calendar */
.time{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-top:9px}
.join{margin-top:auto;height:32px;border-radius:16px;background:var(--blueBtn);color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
/* timer */
.big-or{font-size:30px;font-weight:500;letter-spacing:-.02em;color:var(--orange);line-height:1}
.round{width:36px;height:36px;border-radius:18px;display:grid;place-items:center}
.round.pause{background:rgba(255,159,10,.22);color:var(--orange)}.round.x{background:var(--fill2);color:var(--label)}
/* weather */
.deg{font-size:38px;font-weight:300;letter-spacing:-.03em;line-height:1}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:auto;text-align:center;font-size:11px;color:var(--sec)}
.hours .cap{height:38px;display:flex;align-items:flex-end;justify-content:center;margin:4px 0}
.hours .cap i{width:7px;border-radius:4px;background:#48484A}.hours .now i{background:var(--label)}.hours .now{color:var(--label);font-weight:600}
.hours em{font-style:normal;color:var(--label);font-weight:500}
/* system */
.rings{display:flex;justify-content:space-between;margin-top:auto}
.bat{display:flex;flex-direction:column;align-items:center;gap:6px}
.bat .r{position:relative;width:50px;height:50px}.bat .r svg:last-child{position:absolute;inset:0;margin:auto}
.bat b{font-size:14px;font-weight:600}.bat span{font-size:11px;color:var(--sec);margin-top:-5px}
/* action circle: the island splits off a bubble for the live call */
.ac{position:absolute;top:5px;left:1244px;width:34px;height:34px;border-radius:17px;background:#000;display:grid;place-items:center;color:var(--green)}
.ac::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:3px;background:var(--green)}
.note{position:absolute;font-size:12px;color:#1D1D1F;font-weight:500}
.note span{color:#3A3A3C;font-weight:400}
</style>
</head>
<body>
<div class="desk" aria-hidden="true">
  <div class="win ed"><div class="bar"></div>
    <div class="ln" style="--w:210px"></div><div class="ln" style="--w:330px;--x:52px"></div><div class="ln" style="--w:270px;--x:52px"></div>
    <div class="ln" style="--w:400px;--x:72px"></div><div class="ln" style="--w:180px;--x:72px"></div><div class="ln" style="--w:120px;--x:52px"></div>
    <div class="ln" style="--w:300px"></div><div class="ln" style="--w:350px;--x:52px"></div><div class="ln" style="--w:230px;--x:72px"></div>
    <div class="ln" style="--w:150px;--x:52px"></div><div class="ln" style="--w:90px"></div><div class="ln" style="--w:310px"></div></div>
  <div class="win br"><div class="bar"></div>
    <div class="blk" style="--h:26px;width:44%"></div><div class="blk" style="--h:160px"></div><div class="blk" style="--h:12px;width:70%"></div>
    <div class="blk" style="--h:12px;width:58%"></div><div class="blk" style="--h:96px"></div></div>
</div>

<main class="island" aria-label="Shammy, expanded">
  <div class="top">
    <button class="eyes" aria-label="Shammy home"><i></i><i></i></button>
    <button class="chip">Clipboard</button><button class="chip">Shelf</button><button class="chip">Notes</button><button class="chip">Alerts</button>
    <button class="chip">System</button><button class="chip">Mirror</button><button class="chip">Calendar</button>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m10.8 10.8 3.4 3.4"/></svg>
      <input type="search" placeholder="Search or hold Right Alt" aria-label="Search, or hold Right Alt to talk">
    </label>
  </div>

  <div class="cards">
    <section class="card" aria-label="Now playing">
      <div style="display:flex;gap:11px;align-items:center">
        <div class="art" aria-hidden="true"></div>
        <div style="min-width:0"><div class="title">Kesariya</div><div class="sub">Arijit Singh</div></div>
        <div class="wave" aria-hidden="true"><i style="height:7px"></i><i style="height:14px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:15px"></i><i style="height:6px"></i></div>
      </div>
      <div class="scrub tn"><span>1:58</span><div class="track" role="progressbar" aria-label="Track position" aria-valuenow="118" aria-valuemin="0" aria-valuemax="268"><b style="width:44%"></b></div><span>4:28</span></div>
      <div class="trans">
        <button aria-label="Previous track"><svg width="24" height="16" viewBox="0 0 24 16" fill="currentColor"><path d="M11 1.5v13L1.5 8zM22 1.5v13L12.5 8z"/></svg></button>
        <button aria-label="Pause"><svg width="18" height="20" viewBox="0 0 18 20" fill="currentColor"><rect x="2" y="1" width="5" height="18" rx="1.4"/><rect x="11" y="1" width="5" height="18" rx="1.4"/></svg></button>
        <button aria-label="Next track"><svg width="24" height="16" viewBox="0 0 24 16" fill="currentColor"><path d="M2 1.5v13L11.5 8zM13 1.5v13L22.5 8z"/></svg></button>
      </div>
    </section>

    <section class="card" aria-label="Next event">
      <div class="kick"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#0A84FF" stroke-width="1.7"><rect x="1.8" y="2.8" width="12.4" height="11.4" rx="2.6"/><path d="M1.8 6.5h12.4M5 1v3M11 1v3"/></svg>In 10 min</div>
      <div class="time tn">10:30</div>
      <div class="title" style="margin-top:6px">Standup</div>
      <div class="sub">Google Meet</div>
      <button class="join"><svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="1" width="10.5" height="10" rx="2.4"/><path d="M11.5 5 16 2.2v7.6L11.5 7z"/></svg>Join</button>
    </section>

    <section class="card" aria-label="Timer, Tea">
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="50" height="50" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="21" fill="none" stroke="rgba(255,159,10,.24)" stroke-width="5"/>
          <circle cx="25" cy="25" r="21" fill="none" stroke="#FF9F0A" stroke-width="5" stroke-linecap="round" stroke-dasharray="99.7 131.9" transform="rotate(-90 25 25)"/></svg>
        <div><div class="sub" style="color:var(--orange);font-weight:500">Tea</div><div class="big-or tn" role="timer" aria-label="4 minutes 32 seconds left">4:32</div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:auto">
        <button class="round x" aria-label="Stop timer"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m2 2 8 8M10 2l-8 8"/></svg></button>
        <button class="round pause" aria-label="Pause timer"><svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor"><rect x="1" y="1" width="3.6" height="12" rx="1"/><rect x="7.4" y="1" width="3.6" height="12" rx="1"/></svg></button>
      </div>
    </section>

    <section class="card" aria-label="Weather">
      <div class="kick" style="color:var(--label)">Bhubaneswar<svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor"><path d="M11 1 1 5.3l4.4 1.3L6.7 11z"/></svg></div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px">
        <span class="deg tn">25°</span><span class="sub" style="font-size:12px">Overcast</span></div>
      <div class="hours tn" aria-label="Hourly: now 25, 11 26, 12 27, 13 28, 14 28, 15 27 degrees">
        <div class="now">Now<div class="cap"><i style="height:16px"></i></div><em>25°</em></div>
        <div>11<div class="cap"><i style="height:22px"></i></div><em>26°</em></div>
        <div>12<div class="cap"><i style="height:28px"></i></div><em>27°</em></div>
        <div>13<div class="cap"><i style="height:36px"></i></div><em>28°</em></div>
        <div>14<div class="cap"><i style="height:36px"></i></div><em>28°</em></div>
        <div>15<div class="cap"><i style="height:28px"></i></div><em>27°</em></div>
      </div>
    </section>

    <section class="card" aria-label="System">
      <div class="kick">Batteries</div>
      <div class="rings">
        <div class="bat"><div class="r"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="21.5" fill="none" stroke="rgba(48,209,88,.22)" stroke-width="5"/><circle cx="25" cy="25" r="21.5" fill="none" stroke="#30D158" stroke-width="5"/></svg>
          <svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="#F5F5F7" stroke-width="1.5"><rect x="3" y="1" width="14" height="9" rx="1.5"/><path d="M1 12.5h18"/></svg></div>
          <b class="tn">100%</b><span>Battery</span></div>
        <div class="bat"><div class="r"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="21.5" fill="none" stroke="rgba(48,209,88,.22)" stroke-width="5"/><circle cx="25" cy="25" r="21.5" fill="none" stroke="#30D158" stroke-width="5" stroke-linecap="round" stroke-dasharray="81 135.1" transform="rotate(-90 25 25)"/></svg>
          <svg width="18" height="16" viewBox="0 0 18 16" fill="#F5F5F7"><rect x="2" y="2" width="5" height="9" rx="2.5"/><rect x="11" y="2" width="5" height="9" rx="2.5"/><rect x="5" y="9" width="2" height="6" rx="1"/><rect x="11" y="9" width="2" height="6" rx="1"/></svg></div>
          <b class="tn">60%</b><span>Earbuds</span></div>
      </div>
    </section>
  </div>
</main>

<button class="ac" aria-label="Mute microphone, Google Meet call in progress" aria-pressed="false">
  <svg width="13" height="16" viewBox="0 0 13 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.8" y="1" width="5.4" height="9" rx="2.7"/><path d="M1 7.5a5.5 5.5 0 0 0 11 0M6.5 13v2.2"/></svg>
</button>

<p class="note" style="top:274px;left:0;width:1440px;text-align:center">Expanded <span>&middot; hover to peek, click to open</span></p>
<p class="note" style="top:48px;left:1232px;width:190px;line-height:1.45">Action circle <span><br>On a call: tap to mute</span></p>
</body>
</html>
