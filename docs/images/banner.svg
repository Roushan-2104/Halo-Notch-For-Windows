<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Halo — a Dynamic Island for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12163a"/>
      <stop offset="0.55" stop-color="#3a2e78"/>
      <stop offset="1" stop-color="#963f82"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="0.5" stop-color="#b388ff"/>
      <stop offset="1" stop-color="#64b5f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <!-- soft light behind the notch -->
  <path d="M440 0 H840 V38 a34 34 0 0 1 -34 34 H474 a34 34 0 0 1 -34 -34 Z" fill="none" stroke="url(#edge)" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
  <!-- the notch -->
  <path d="M440 0 H840 V38 a34 34 0 0 1 -34 34 H474 a34 34 0 0 1 -34 -34 Z" fill="#000" filter="url(#shadow)"/>
  <path d="M440 0 H840 V38 a34 34 0 0 1 -34 34 H474 a34 34 0 0 1 -34 -34 Z" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
  <!-- inside the notch: a live activity -->
  <circle cx="486" cy="34" r="11" fill="none" stroke="#ff8a65" stroke-width="3"/>
  <text x="510" y="40" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#e8e6f5">Deep work</text>
  <text x="794" y="40" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">24:49</text>
  <!-- wordmark -->
  <text x="640" y="214" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="600" letter-spacing="-2" fill="#ffffff">Halo</text>
  <text x="640" y="262" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#d9d3f2">A Dynamic Island for Windows — ask, circle, play, and get things done from the top of your screen.</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#b9b0e0" letter-spacing="1" text-anchor="middle">
    <text x="420" y="318">RIGHT ALT · TALK</text>
    <text x="640" y="318">COPILOT · CIRCLE</text>
    <text x="870" y="318">HOVER · EVERYTHING ELSE</text>
  </g>
</svg>
